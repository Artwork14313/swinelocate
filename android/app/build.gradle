plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swine.locate'
    compileSdk 36

    defaultConfig {
        applicationId 'com.swine.locate'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
        buildConfigField 'String', 'API_BASE_URL', '"https://swinelocate-production-h3g41v.laravel.cloud/api/mobile"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
